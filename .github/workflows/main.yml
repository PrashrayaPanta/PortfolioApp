name: 🚀 Deploy HTML/CSS to cPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get your HTML/CSS files
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Auto-deploy to cPanel
      - name: 🚀 Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Your cPanel FTP credentials (set in GitHub Secrets)
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Upload everything from repo root to cPanel web folder
          local-dir: ./
          server-dir: ./public_html/
          
